<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lindows Full Screen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* Eliminates the default bottom spacing */
        }
    </style>
</head>
<body>

    <iframe src="https://websim.com" title="Lindows WebSim"></iframe>

</body>
</html>
